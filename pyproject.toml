[project]
name = "churnlab"
version = "0.1.0"
description = "Telco customer churn prediction project (ESILV - Machine Learning Operations)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "joblib>=1.4",
    "numpy~=1.26.0",
    "pandas>=2.2,<2.3",
    "scikit-learn>=1.5,<1.6",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.16,<2.18"]
kubeflow = ["kfp>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
